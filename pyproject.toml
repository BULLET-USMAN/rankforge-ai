[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "migrations",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501", # line length
    "F821", # forward references in SQLAlchemy Mapped string annotations
]

[tool.ruff.lint.isort]
known-first-party = ["app", "services"]
